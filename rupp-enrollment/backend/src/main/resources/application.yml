server:
  port: 8080

spring:
  application:
    name: rupp-enrollment-api
  datasource:
    url: jdbc:h2:file:./data/rupp;AUTO_SERVER=TRUE
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: true
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 12MB

app:
  cors-origin: http://localhost:3000
  upload-dir: ./uploads
  jwt:
    # Change in production (at least 32 characters). Prefer an environment variable.
    secret: ${JWT_SECRET:rupp-enrollment-dev-secret-change-me-please-0123456789}
    ttl-minutes: 720
